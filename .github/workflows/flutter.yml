name: Flutter checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Native platform folders are intentionally not committed yet.
      # Generate them in CI so Flutter tooling can validate the app.
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
