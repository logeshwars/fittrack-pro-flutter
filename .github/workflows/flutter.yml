name: Flutter checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform scaffolding
        run: |
          flutter create --platforms=android,ios --org com.logesh .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # The APK is built by the "Android APK build" workflow, which runs on
      # the same pushes and resets the stale Gradle template first. Building
      # it here as well only burns minutes and fails on the committed
      # Gradle wrapper.

  ios-project-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate native scaffolding
        run: |
          # Five of our plugins (flutter_local_notifications,
          # flutter_secure_storage, flutter_timezone, health,
          # mobile_scanner) have no Swift Package Manager support, so the
          # build needs CocoaPods either way. With SPM also enabled — the
          # default since Flutter 3.50 — the generated Runner target ends up
          # referencing Pods_Runner without the Pods project in the
          # workspace, and the link step fails with "Framework 'Pods_Runner'
          # not found". Stay on the CocoaPods-only path until those plugins
          # adopt SPM.
          flutter config --no-enable-swift-package-manager
          # The committed Xcode project and Podfile come from an older
          # Flutter template. Drop the generated iOS project so it is
          # rebuilt against the Flutter installed above; our own sources
          # (AppDelegate, Info.plist, assets) are regenerated too.
          rm -rf ios/Runner.xcodeproj ios/Runner.xcworkspace ios/Podfile \
            ios/Podfile.lock ios/Flutter/Debug.xcconfig \
            ios/Flutter/Release.xcconfig ios/Flutter/AppFrameworkInfo.plist
          flutter create --platforms=android,ios --org com.logesh .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --dart-define=SUPABASE_URL= --dart-define=SUPABASE_ANON_KEY=
