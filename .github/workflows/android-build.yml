name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/bootstrap_native.sh'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/bootstrap_native.sh'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate development Android project
        run: |
          # The committed Gradle/AGP/Kotlin files come from an older Flutter
          # template. Drop them so `flutter create` regenerates versions that
          # match the Flutter installed above; bootstrap re-applies our patches.
          rm -f android/settings.gradle.kts android/build.gradle.kts \
            android/gradle.properties android/app/build.gradle.kts \
            android/gradle/wrapper/gradle-wrapper.properties
          bash tool/bootstrap_native.sh
      - name: Install Android NDK with retries
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION" < /dev/null && \
               [[ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]]; then
              echo "Android NDK installed successfully"
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::NDK download/install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Fetch packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Restore fixed debug keystore
        # Without this, every run signs with a new random debug key, so the
        # SHA-1 registered for Google Sign-In would never match.
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Restored fixed debug keystore"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set; Google Sign-In will not match a registered SHA-1"
          fi
      - name: Build APKs
        env:
          SUPABASE_URL: ${{ github.event_name == 'pull_request' && '' || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ github.event_name == 'pull_request' && '' || secrets.GOOGLE_WEB_CLIENT_ID }}
          REVENUECAT_ANDROID_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.REVENUECAT_ANDROID_KEY }}
          USDA_FDC_API_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.USDA_FDC_API_KEY }}
          SENTRY_DSN: ${{ github.event_name == 'pull_request' && '' || secrets.SENTRY_DSN }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY" \
            --dart-define=USDA_FDC_API_KEY="$USDA_FDC_API_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"
          # Arm64-only release APK for phone installs. A debug APK carries the
          # Dart VM in JIT mode plus unstripped symbols and runs past 50 MB
          # even for one ABI, which forced the Telegram upload to be split
          # into parts the phone cannot rejoin on its own. Release is AOT and
          # roughly a third of the size, so it arrives as one tappable file.
          # Release signing points at the same debug config (app/build.gradle
          # .kts), so this APK carries the fixed keystore and the SHA-1
          # registered for Google Sign-In still matches.
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY" \
            --dart-define=USDA_FDC_API_KEY="$USDA_FDC_API_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"
      - name: Show APK signing certificate (register this SHA-1 in Google Cloud)
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -d "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          {
            echo "### APK signing certificate"
            echo "Package: \`com.logesh.fittrackpro.flutterdev\`"
            echo
            echo "**From the signed APK (this is what Google checks):**"
            echo '```'
            if [[ -n "$APKSIGNER" ]]; then
              "$APKSIGNER" verify --print-certs "$APK" 2>&1 | grep -E "certificate (DN|SHA-1|SHA-256)" || echo "apksigner printed no certificate"
            else
              echo "apksigner not found"
            fi
            echo '```'
            echo "**From the keystore file used for signing:**"
            echo '```'
            keytool -list -v -keystore "${DEBUG_KEYSTORE_PATH:-$HOME/.android/debug.keystore}" -alias androiddebugkey \
              -storepass android -keypass android 2>&1 | grep -E "SHA1|SHA256" || echo "keystore not readable"
            echo '```'
            echo "Add the **SHA-1** value to the Android OAuth client in Google Cloud."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -n "${DEBUG_KEYSTORE_PATH:-}" && -n "$APKSIGNER" ]]; then
            APK_SHA="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
            KS_SHA="$(keytool -list -v -keystore "$DEBUG_KEYSTORE_PATH" -alias androiddebugkey -storepass android -keypass android | sed -n 's/.*SHA1: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
            if [[ "$APK_SHA" != "$KS_SHA" ]]; then
              echo "::error::APK is not signed with the restored keystore (APK $APK_SHA vs keystore $KS_SHA)"
              exit 1
            fi
            echo "APK signature matches the restored keystore."
          fi
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-pro-flutter-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Notify Telegram
        # Runs on success and failure. Skipped on pull requests (no secrets)
        # and until TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are configured.
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets not set; skipping notification"
            exit 0
          fi
          OUT=build/app/outputs/flutter-apk
          # Prefer the arm64 release APK: it is the one that fits in a single
          # upload, so it can be installed straight from the chat.
          for candidate in app-arm64-v8a-release.apk app-arm64-v8a-debug.apk app-debug.apk; do
            APK="$OUT/$candidate"
            [[ -f "$APK" ]] && break
          done
          LIMIT=52428800  # Bot API upload limit (50 MB)
          if [[ "$JOB_STATUS" == "success" ]]; then ICON="✅"; WORD="succeeded"; else ICON="❌"; WORD="$JOB_STATUS"; fi
          TEXT="$ICON FitTrack Pro Android build $WORD
          Branch: $BRANCH (${SHA:0:7})
          ${COMMIT_MSG%%$'\n'*}
          $RUN_URL"
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          send_doc() {  # file, caption
            curl -sS --fail -o /dev/null "$API/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"$1" -F caption="$2" \
              || echo "::warning::Telegram upload failed for $1"
          }
          if [[ "$JOB_STATUS" == "success" && -f "$APK" ]]; then
            if [[ $(stat -c%s "$APK") -lt $LIMIT ]]; then
              SIZE_MB=$(( $(stat -c%s "$APK") / 1048576 ))
              send_doc "$APK" "$TEXT

          $(basename "$APK") · ${SIZE_MB} MB
          Tap the file, then Install. Allow installs from Telegram if Android asks."
            else
              # Still too big for one upload: send plain parts to join on a computer.
              mkdir -p "$RUNNER_TEMP/tg" && rm -f "$RUNNER_TEMP/tg"/*
              split -b 45m -d "$APK" "$RUNNER_TEMP/tg/fittrack-debug.apk.part"
              PARTS=("$RUNNER_TEMP/tg"/fittrack-debug.apk.part*)
              SUM="$(sha256sum "$APK" | cut -d" " -f1)"
              curl -sS --fail -o /dev/null "$API/sendMessage" \
                --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
                --data-urlencode text="$TEXT

          $(basename "$APK") is ${#PARTS[@]} parts (over the 50 MB bot limit), so it has to be rejoined before it will install. Download every part, keeping the names as they arrive, then:

          Android, in Termux (run termux-setup-storage once):
            cd /sdcard/Download/Telegram && cat fittrack-debug.apk.part* > fittrack.apk
          Then open fittrack.apk from Files and tap Install.

          Linux or macOS:
            cat fittrack-debug.apk.part* > fittrack.apk

          Windows, in cmd (not PowerShell):
            copy /b fittrack-debug.apk.part00 + fittrack-debug.apk.part01 fittrack.apk

          Check the join worked - this must match:
            $SUM

          Or skip all of it and take the APK from the run page: $RUN_URL" \
                || echo "::warning::Telegram message failed"
              for part in "${PARTS[@]}"; do send_doc "$part" "$(basename "$part")"; done
            fi
          else
            curl -sS --fail -o /dev/null "$API/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$TEXT" \
              || echo "::warning::Telegram message failed"
          fi
